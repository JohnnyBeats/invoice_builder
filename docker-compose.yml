services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice-db
    environment:
      POSTGRES_DB: invoice_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoice_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./InvoiceService
      dockerfile: Dockerfile
    container_name: invoice-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=invoice_db;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./invoice-client
      dockerfile: Dockerfile
    container_name: invoice-client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
